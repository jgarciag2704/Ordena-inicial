<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordena · La Burguería</title><link rel="stylesheet" href="assets/styles.css"></head><body><main class="shell"><header class="top"><div><div class="tag">PEDIDO DIRECTO</div><div class="brand">La Burguería</div></div><button class="chip" onclick="openCart()">🛒 <span id="cartCount">0</span></button></header><section class="hero"><div class="tag">Abierto ahora · 25–35 min</div><h1>Tu antojo, directo del restaurante.</h1><p>Arma tu pedido como te gusta. Sin intermediarios y con atención directa.</p></section><section class="modes" id="modes"><button class="mode active" data-mode="pickup"><strong>🛍️ Recoger</strong><span>Listo para pasar por él</span></button><button class="mode" data-mode="mesa"><strong>🍽️ Comer aquí</strong><span>Ingresa tu número de mesa</span></button><button class="mode" data-mode="delivery"><strong>🛵 A domicilio</strong><span>Envío según tu zona</span></button></section><section class="section"><h2>Menú</h2><div class="chips"><button class="chip active">Populares</button><button class="chip">Hamburguesas</button><button class="chip">Combos</button><button class="chip">Papas y extras</button><button class="chip">Bebidas</button></div><div class="grid" id="products"></div></section></main><button class="cart" onclick="openCart()">Ver carrito · <span id="cartTotal">$0</span></button><div class="drawer" id="drawer"><aside class="panel"><button class="chip" onclick="closeAll()">Cerrar ×</button><h2>Tu carrito</h2><div id="cartItems"></div><div class="totals"><div class="row"><b>Total</b><b id="totalAside">$0</b></div></div><button class="primary" style="width:100%" onclick="checkout()">Continuar pedido</button></aside></div><div class="modal" id="productModal"><section class="modalbox"><button class="chip" onclick="closeAll()">Cerrar ×</button><h2 id="modalTitle"></h2><p class="muted">Personaliza esta pieza antes de agregar
