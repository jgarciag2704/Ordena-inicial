services:
  app:
    build: .
    container_name: ordena_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
    networks:
      - ordena-network
    env_file: .env

  nginx:
    image: nginx:1.27-alpine
    container_name: ordena_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./public/uploads:/var/www/html/public/uploads:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ordena-network

  db:
    image: mariadb:11
    container_name: ordena_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ordena_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 5s
      retries: 10
    networks:
      - ordena-network

  redis:
    image: redis:7-alpine
    container_name: ordena_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
    networks:
      - ordena-network

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: ordena_evolution_api
    restart: unless-stopped
    volumes:
      - evolution_instances:/evolution/instances
    env_file: .env
    environment:
      TZ: America/Mexico_City
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_API_URL:-http://evolution-api:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_API_KEY}
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_COLOR: "false"
      CONFIG_SESSION_PHONE_CLIENT: "Ordena"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CACHE_DB_ENABLED: "false"
      DATABASE_PROVIDER: mysql
      DATABASE_ENABLED: "true"
      DATABASE_CONNECTION_URI: mysql://evolution_user:${EVOLUTION_DB_PASSWORD}@evolution_db:3306/evolution_db
    depends_on:
      evolution_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/instance/fetchInstances"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "127.0.0.1:8090:8080"
    networks:
      - ordena-network

  evolution_db:
    image: mysql:8.0
    container_name: ordena_evolution_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${EVOLUTION_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: evolution_db
      MYSQL_USER: evolution_user
      MYSQL_PASSWORD: ${EVOLUTION_DB_PASSWORD}
    volumes:
      - evolution_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ordena-network

networks:
  ordena-network:
    driver: bridge

volumes:
  ordena_db:
  evolution_instances:
  evolution_db_data:
