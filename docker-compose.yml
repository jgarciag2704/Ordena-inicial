services:
  app:
    build: .
    env_file: .env
    volumes:
      - ./:/var/www/html
    depends_on: [db, redis]
  nginx:
    image: nginx:1.27-alpine
    ports: ["8088:80"]
    volumes:
      - ./public:/var/www/html/public:ro
      - ./public/uploads:/var/www/html/public/uploads:ro
      - ./app:/var/www/html/app:ro
      - ./config:/var/www/html/config:ro
      - ./routes:/var/www/html/routes:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
  db:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes: ["ordena_db:/var/lib/mysql"]

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8089:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

  redis:
    image: redis:7-alpine
  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    container_name: ordena_evolution_api
    profiles: ["whatsapp"]
    volumes:
      - evolution_instances:/evolution/instances
    env_file:
      - .env
    environment:
      TZ: America/Mexico_City
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_API_URL:-http://evolution-api:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_API_KEY:-}
      LOG_LEVEL: ERROR,WARN,INFO,WEBHOOKS
      LOG_COLOR: "false"
      CONFIG_SESSION_PHONE_CLIENT: "Ordena"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CACHE_DB_ENABLED: "false"
      DATABASE_PROVIDER: mysql
      DATABASE_ENABLED: "true"
      DATABASE_CONNECTION_URI: mysql://evolution_user:evolution_pass@evolution_db:3306/evolution_db
    depends_on:
      evolution_db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"

  evolution_db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: evolution_root_pass
      MYSQL_DATABASE: evolution_db
      MYSQL_USER: evolution_user
      MYSQL_PASSWORD: evolution_pass
    volumes: ["evolution_db_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: ["php", "/var/www/html/public/index.php"]
    env_file: .env
    volumes:
      - ./:/var/www/html
    depends_on: [redis, db]
volumes:
  ordena_db:
  evolution_instances:
  evolution_db_data:
