services:
  app:
    build: .
    env_file: .env
    volumes:
      - ./:/var/www/html
    depends_on: [db, redis]
  nginx:
    image: nginx:1.27-alpine
    ports: ["8088:80"]
    volumes:
      - ./public:/var/www/html/public:ro
      - ./public/uploads:/var/www/html/public/uploads:ro
      - ./app:/var/www/html/app:ro
      - ./config:/var/www/html/config:ro
      - ./routes:/var/www/html/routes:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
  db:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes: ["ordena_db:/var/lib/mysql"]

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8089:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

  redis:
    image: redis:7-alpine
  worker:
    build: .
    command: ["php", "/var/www/html/public/index.php"]
    env_file: .env
    volumes:
      - ./:/var/www/html
    depends_on: [redis, db]
volumes:
  ordena_db:
